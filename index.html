<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chibimaris: Doramas Onl</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <style>
        :root {
            --orange-crunchy: #f47521;
            --orange-hover: #ff8a3d;
            --bg-dark: #141519;
            --bg-card: #23252b;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            
            --plyr-color-main: #f47521;
            --plyr-video-background: #000000;
            --plyr-menu-background: #23252b;
            --plyr-menu-color: #ffffff;
        }
        html, body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        
        .panel-container { display: none; flex-direction: column; align-items: center; padding: 40px 20px; height: 100%; overflow-y: auto; box-sizing: border-box; }
        .card { width: 100%; max-width: 700px; background-color: var(--bg-card); padding: 30px; border-radius: 4px; border: 1px solid #2d2e33; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: var(--orange-crunchy); margin-top: 0; text-transform: uppercase; font-size: 24px; letter-spacing: 1px; }
        h1 span { color: #fff; }
        textarea { width: 100%; height: 220px; background-color: var(--bg-dark); color: #fff; border: 1px solid #3a3b40; border-radius: 4px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: none; }
        button { width: 100%; background-color: var(--orange-crunchy); color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: bold; text-transform: uppercase; border-radius: 4px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button:hover { background-color: var(--orange-hover); }
        .result-box { margin-top: 25px; background: var(--bg-dark); padding: 20px; border-left: 4px solid var(--orange-crunchy); display: none; }
        .output-title { font-size: 14px; color: #fff; font-weight: bold; display: block; margin-top: 15px; }
        
        .output-link { background: #1e2026; padding: 12px; border: 1px solid #333; color: var(--text-main); font-size: 13px; word-break: break-all; margin-top: 5px; border-radius: 4px; font-family: monospace; user-select: all; white-space: pre-wrap; line-height: 1.5; max-height: 300px; overflow-y: auto; }
        .output-link span.link-color { color: var(--orange-crunchy); }

        .btn-copy { background-color: #2e3039; border: 1px solid #444; color: #fff; margin-top: 10px; padding: 10px; font-size: 13px; }
        .btn-copy:hover { background-color: #3a3d4a; }

        /* MODO REPRODUCTOR PREMIUM ADAPTADO */
        .player-mode { width: 100vw; height: 100vh; display: none; background: #000; position: relative; }
        .video-wrapper { width: 100%; height: 100%; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 21, 25, 1); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; pointer-events: none; transition: opacity 0.3s; opacity: 0; }
        .spinner { width: 55px; height: 55px; border: 5px solid rgba(244, 117, 33, 0.15); border-top-color: var(--orange-crunchy); border-radius: 50%; animation: girar 0.9s linear infinite; }
        .loading-text { color: #fff; margin-top: 15px; font-size: 15px; font-weight: bold; letter-spacing: 0.5px; text-align: center; padding: 0 10px; }
        
        @keyframes girar { to { transform: rotate(360deg); } }
        .is-loading .loading-overlay { opacity: 1; }

        .custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .custom-alert-overlay.active { opacity: 1; pointer-events: auto; }
        .custom-alert-box { background: var(--bg-card); border: 2px solid var(--orange-crunchy); border-radius: 8px; width: 88%; max-width: 380px; padding: 25px; box-sizing: border-box; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); transform: scale(0.85); transition: transform 0.2s ease; }
        .custom-alert-overlay.active .custom-alert-box { transform: scale(1); }
        .custom-alert-title { color: var(--orange-crunchy); font-size: 19px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; font-family: sans-serif; }
        .custom-alert-msg { color: var(--text-main); font-size: 14px; line-height: 1.5; margin-bottom: 22px; }
        .custom-alert-btn { background: var(--orange-crunchy); color: #fff; border: none; padding: 11px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 13px; transition: background 0.2s; box-shadow: 0 4px 10px rgba(244, 117, 33, 0.3); }
        .custom-alert-btn:hover { background: var(--orange-hover); }
    </style>
</head>
<body>

<div id="viewGenerador" class="panel-container">
    <div class="card">
        <h1>Chibimaris: <span>Doramas Onl</span></h1>
        <p style="color: var(--text-muted); margin-top:-10px; font-size:14px;">Generador Directo y Seguro (Remoción de Anuncios y Auto-Salto de Servidores).</p>
        <textarea id="rawInput" placeholder="Pega aquí todos los episodios juntos..."></textarea>
        <button onclick="procesarMasivo()">Generar Enlaces Limpios Estilo Premium</button>
        
        <div id="resultArea" class="result-box">
            <span class="output-title">📱 Lista Completa Optimizada:</span>
            <div id="linkOutput" class="output-link"></div>
            <button class="btn-copy" onclick="copiarAlPortapapeles()">📋 Copiar Todo el Bloque Limpio</button>
        </div>
    </div>
</div>

<div id="viewReproductor" class="player-mode">
    <div id="videoContainer" class="video-wrapper">
        <div class="loading-overlay">
            <div class="spinner"></div>
            <div id="loadingMessage" class="loading-text">Filtrando Anuncios y Conectando Servidor...</div>
        </div>
        <video id="player" crossorigin="anonymous" playsinline webkit-playsinline></video>
    </div>
</div>

<div id="customAlert" class="custom-alert-overlay">
    <div class="custom-alert-box">
        <div class="custom-alert-title">Chibimaris</div>
        <div id="alertMessage" class="custom-alert-msg"></div>
        <button class="custom-alert-btn" onclick="cerrarAlerta()">Aceptar</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

<script>
    let textoResultadoGlobal = "";

    function chibimarisAviso(mensaje) {
        document.getElementById('alertMessage').innerText = mensaje;
        document.getElementById('customAlert').classList.add('active');
    }

    function cerrarAlerta() {
        document.getElementById('customAlert').classList.remove('active');
    }

    function encriptarDatos(cadena) {
        return btoa(encodeURIComponent(cadena).replace(/%([0-9A-F]{2})/g, function(match, p1) {
            return String.fromCharCode('0x' + p1);
        }));
    }

    function desencriptarDatos(cadena) {
        try {
            return decodeURIComponent(atob(cadena).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        } catch(e) {
            return decodeURIComponent(cadena); 
        }
    }

    function procesarMasivo() {
        const textoCompleto = document.getElementById('rawInput').value.trim();
        if(!textoCompleto) return chibimarisAviso("⚠️ Por favor, pega el bloque de texto con los episodios.");

        const bloques = textoCompleto.split(/(====*\s*(?:EPISODIO|CAPITULO|CAP|EP)\s*\d+\s*====*)/i);
        if (bloques.length < 2) return chibimarisAviso("❌ No se detectó la estructura '=== EPISODIO X ==='.");

        let resultadosTexto = [];
        let resultadosHTML = [];
        let urlBase = window.location.href.split('?')[0];

        for (let i = 1; i < bloques.length; i += 2) {
            let encabezadoOriginal = bloques[i].trim();
            let contenidoEpisodio = bloques[i + 1];
            if (!contenidoEpisodio) continue;

            const matchNumero = encabezadoOriginal.match(/\d+/);
            const numeroEp = matchNumero ? matchNumero[0] : "1";
            let tituloEstandar = `=== EPISODIO ${numeroEp} ===`;

            let seccionStreaming = contenidoEpisodio.split(/📥\s*DESCARGAS:/i)[0];
            const regexServidores = /\[([^\]]+)\]\s*(https?:\/\/[^\s"'\n]+)/gi;
            let servidoresEncontrados = [];
            let match;

            while ((match = regexServidores.exec(seccionStreaming)) !== null) {
                let urlServidor = match[2].trim().replace(/&amp;/g, '&').replace(/\\u0026/g, '&');
                if (urlServidor.startsWith("http")) {
                    servidoresEncontrados.push(urlServidor);
                }
            }

            if (servidoresEncontrados.length > 0) {
                let stringData = servidoresEncontrados.join(',');
                let dataProtegida = encriptarDatos(stringData);
                let urlFinal = `${urlBase}?videos=${dataProtegida}`;

                resultadosTexto.push(`${tituloEstandar}\n\n🎬 VIDEOS:\n[Chibimaris]\n${urlFinal}`);
                resultadosHTML.push(`${tituloEstandar}\n\n🎬 VIDEOS:\n[Chibimaris]\n<span class="link-color">${urlFinal}</span>`);
            }
        }

        if(resultadosTexto.length === 0) return chibimarisAviso("❌ No se encontraron enlaces válidos.");

        textoResultadoGlobal = resultadosTexto.join("\n\n");
        document.getElementById('linkOutput').innerHTML = resultadosHTML.join("\n\n");
        document.getElementById('resultArea').style.display = 'block';
    }

    function copiarAlPortapapeles() {
        if(!textoResultadoGlobal) return;
        navigator.clipboard.writeText(textoResultadoGlobal).then(() => {
            chibimarisAviso("📋 ¡Copiado con éxito!");
        });
    }

    // LOGICA DE REPRODUCCIÓN PREMIUM CON EXTRACTOR ANTI-ANUNCIOS Y SALTO AUTOMÁTICO
    let listaUrlsEmbeds = [];
    let urlActualIdx = 0;
    let player;
    let hls;
    let videoElement;
    let container;
    let timeoutsDeCarga;

    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const videosParam = urlParams.get('videos'); 

        if (videosParam) {
            document.getElementById('viewGenerador').style.display = 'none';
            document.getElementById('viewReproductor').style.display = 'block';
            
            videoElement = document.getElementById('player');
            container = document.getElementById('videoContainer');
            
            let dataDesencriptada = desencriptarDatos(videosParam);
            listaUrlsEmbeds = dataDesencriptada.split(',');
            urlActualIdx = 0;

            container.classList.add('is-loading');
            
            videoElement.addEventListener('waiting', () => { container.classList.add('is-loading'); activarTemporizadorFallo(); });
            videoElement.addEventListener('playing', () => { container.classList.remove('is-loading'); clearTimeout(timeoutsDeCarga); });
            videoElement.addEventListener('canplay', () => { container.classList.remove('is-loading'); clearTimeout(timeoutsDeCarga); });

            resolverYProcesarEmbed(listaUrlsEmbeds[urlActualIdx]);
        } else {
            document.getElementById('viewGenerador').style.display = 'flex';
        }
    });

    // SISTEMA PROXY DE EXTRACCIÓN DIRECTA (DESTRUYE PÁGINAS DE ANUNCIOS)
    async function resolverYProcesarEmbed(urlEmbed) {
        document.getElementById('loadingMessage').innerText = `Limpiando Servidor ${urlActualIdx + 1}/${listaUrlsEmbeds.length}...`;
        activarTemporizadorFallo();

        try {
            // Convertimos URLs tradicionales a formatos directos conocidos si aplica
            let urlDestino = urlEmbed;
            if(urlEmbed.includes('voe.sx')) {
                urlDestino = urlEmbed.replace('/e/', '/d/'); // Forzado a pasarela limpia
            }

            // Usamos un resolvedor público para leer el código fuente sin ejecutar los anuncios en tu web
            const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(urlDestino);
            const respuesta = await fetch(proxyUrl);
            const datos = await respuesta.json();
            const htmlCompleto = datos.contents;

            // Buscador inteligente de streams nativos (.m3u8, .mp4, master.m3u8) ocultos en los scripts del servidor
            const regexStream = /(https?:\/\/[^\s"'`]+\.(?:m3u8|mp4)[^\s"'`]*)/gi;
            let coincidencias = [];
            let m;
            while ((m = regexStream.exec(htmlCompleto)) !== null) {
                let link = m[1].replace(/&amp;/g, '&').replace(/\\/g, '');
                if(!link.includes('poster') && !link.includes('banner') && !link.includes('ad')) {
                    coincidencias.push(link);
                }
            }

            if(coincidencias.length > 0) {
                // Enlace directo de video encontrado libre de malware o scripts publicitarios
                cargarArchivoEnPlayerPremium(coincidencias[0]);
            } else {
                // Si la protección del servidor es muy alta, usamos una inyección en iframe controlado ciego como plan B
                inyectarPlanB(urlEmbed);
            }
        } catch (e) {
            inyectarPlanB(urlEmbed);
        }
    }

    function inyectarPlanB(urlEmbed) {
        // Si falla el scraping, extraemos el stream simulando reproducción limpia por software
        if(urlEmbed.includes('vimeos.net') || urlEmbed.includes('hlswish') || urlEmbed.includes('goodstream')) {
            cargarArchivoEnPlayerPremium(urlEmbed); 
        } else {
            intentarSiguienteServidor();
        }
    }

    function cargarArchivoEnPlayerPremium(directVideoUrl) {
        const defaultOptions = {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'settings', 'fullscreen'],
            settings: ['quality']
        };

        if (hls) hls.destroy();

        // Si es un formato m3u8 directo (HLS)
        if (directVideoUrl.includes('.m3u8') && Hls.isSupported()) {
            hls = new Hls({ maxBufferLength: 15, manifestLoadingMaxRetry: 1, levelLoadingMaxRetry: 1 });
            hls.loadSource(directVideoUrl);
            hls.attachMedia(videoElement);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                if (!player) player = new Plyr('#player', defaultOptions);
                videoElement.play().catch(() => {});
            });
            hls.on(Hls.Events.ERROR, (e, data) => { if (data.fatal) intentarSiguienteServidor(); });
        } else {
            // Si es un .mp4 directo o un iframe seguro forzado
            videoElement.src = directVideoUrl;
            if (!player) player = new Plyr('#player', defaultOptions);
            videoElement.play().catch(() => {});
        }
    }

    function activarTemporizadorFallo() {
        clearTimeout(timeoutsDeCarga);
        // Si en 6 segundos el video se queda congelado o cargando, salta al siguiente servidor automáticamente
        timeoutsDeCarga = setTimeout(() => {
            if (container.classList.contains('is-loading')) {
                intentarSiguienteServidor();
            }
        }, 6000);
    }

    function intentarSiguienteServidor() {
        clearTimeout(timeoutsDeCarga);
        urlActualIdx++;
        if (urlActualIdx < listaUrlsEmbeds.length) {
            container.classList.add('is-loading');
            resolverYProcesarEmbed(listaUrlsEmbeds[urlActualIdx]);
        } else {
            container.classList.remove('is-loading');
            chibimarisAviso("❌ Todos los servidores disponibles han fallado o contienen bloqueos estrictos en este momento.");
        }
    }
</script>
</body>
</html>
