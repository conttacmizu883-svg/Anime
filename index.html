<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chibimaris: Doramas Onl</title>
    <style>
        :root {
            --orange-crunchy: #f47521;
            --orange-hover: #ff8a3d;
            --bg-dark: #141519;
            --bg-card: #23252b;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
        }
        html, body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        
        .panel-container { display: none; flex-direction: column; align-items: center; padding: 40px 20px; height: 100%; overflow-y: auto; box-sizing: border-box; }
        .card { width: 100%; max-width: 700px; background-color: var(--bg-card); padding: 30px; border-radius: 4px; border: 1px solid #2d2e33; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: var(--orange-crunchy); margin-top: 0; text-transform: uppercase; font-size: 24px; letter-spacing: 1px; }
        h1 span { color: #fff; }
        textarea { width: 100%; height: 220px; background-color: var(--bg-dark); color: #fff; border: 1px solid #3a3b40; border-radius: 4px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; resize: none; }
        button { width: 100%; background-color: var(--orange-crunchy); color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: bold; text-transform: uppercase; border-radius: 4px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button:hover { background-color: var(--orange-hover); }
        .result-box { margin-top: 25px; background: var(--bg-dark); padding: 20px; border-left: 4px solid var(--orange-crunchy); display: none; }
        .output-title { font-size: 14px; color: #fff; font-weight: bold; display: block; margin-top: 15px; }
        
        .output-link { background: #1e2026; padding: 12px; border: 1px solid #333; color: var(--text-main); font-size: 13px; word-break: break-all; margin-top: 5px; border-radius: 4px; font-family: monospace; user-select: all; white-space: pre-wrap; line-height: 1.5; max-height: 300px; overflow-y: auto; }
        .output-link span.link-color { color: var(--orange-crunchy); }

        .btn-copy { background-color: #2e3039; border: 1px solid #444; color: #fff; margin-top: 10px; padding: 10px; font-size: 13px; }
        .btn-copy:hover { background-color: #3a3d4a; }

        /* REPRODUCTOR TOTALMENTE INMERSIVO (100% PANTALLA) */
        .player-mode { width: 100vw; height: 100vh; display: none; background: #000; position: relative; }
        
        .video-wrapper { width: 100%; height: 100%; position: relative; background: #000; z-index: 1; }
        iframe { width: 100%; height: 100%; border: none; display: block; background: #000; }
        
        /* WATERMARK / MARCA DE AGUA INAMOVIBLE */
        .player-watermark { position: absolute; top: 20px; right: 20px; font-size: 16px; font-weight: 900; letter-spacing: 1.5px; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 10; font-family: 'Arial Black', sans-serif; pointer-events: none; text-transform: uppercase; }
        .player-watermark span { color: var(--orange-crunchy); }

        /* BOTÓN FLOTANTE LATERAL ESTILO APP PREMIUM */
        .floating-menu-container { position: absolute; top: 50%; left: 0; transform: translateY(-50%); z-index: 10; display: flex; align-items: center; }
        
        .floating-trigger-btn { background: #e51c23; color: #fff; border: none; width: 44px; height: 52px; border-radius: 0 30px 30px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; box-shadow: 4px 0 12px rgba(0,0,0,0.4); transition: background 0.2s, transform 0.2s; padding-right: 4px; }
        .floating-trigger-btn:hover { background: #ff2d35; transform: scaleX(1.05); }
        
        /* Icono de flecha geométrica */
        .arrow-icon { width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 9px solid #fff; transition: transform 0.3s; }
        .floating-menu-container.open .arrow-icon { transform: rotate(180deg); }

        /* Globo indicador numérico con cantidad de servidores */
        .server-badge { position: absolute; top: -8px; right: -4px; background: #fff; color: #000; font-size: 11px; font-weight: 900; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; border: 1.5px solid #e51c23; box-shadow: 0 2px 5px rgba(0,0,0,0.3); }

        /* PANEL DESPLEGABLE DESDE LA IZQUIERDA */
        .server-sidebar { position: absolute; top: 0; left: -260px; width: 240px; height: 100%; background: rgba(20, 21, 25, 0.96); border-right: 2px solid var(--orange-crunchy); box-shadow: 10px 0 30px rgba(0,0,0,0.7); z-index: 9; transition: left 0.3s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; padding: 25px 15px; box-sizing: border-box; }
        .server-sidebar.show { left: 0; }
        
        .sidebar-title { font-size: 13px; font-weight: bold; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; border-bottom: 1px solid #2d2e33; padding-bottom: 8px; }
        .sidebar-list { flex: 1; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
        
        .server-btn { width: 100%; text-align: left; background: #23252b; color: #fff; border: 1px solid #3d404a; padding: 12px 16px; font-size: 13px; font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 4px; transition: 0.2s; }
        .server-btn:hover { background: #2e3039; border-color: var(--orange-crunchy); color: var(--orange-crunchy); }
        .server-btn.active { background: var(--orange-crunchy); border-color: var(--orange-crunchy); color: #fff; box-shadow: 0 0 12px rgba(244,117,33,0.3); }
        
        /* CAPA DE CARGA ADGUARD SIMULADO */
        .dns-shield-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #141519; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; pointer-events: none; transition: opacity 0.4s; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(244, 117, 33, 0.1); border-top-color: var(--orange-crunchy); border-radius: 50%; animation: girar 1s linear infinite; }
        .dns-text { color: #fff; margin-top: 15px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; text-align: center; }
        .dns-status { color: #4ade80; font-size: 12px; margin-top: 5px; font-family: monospace; }
        @keyframes girar { to { transform: rotate(360deg); } }
        
        .ready .dns-shield-overlay { opacity: 0; }

        .custom-alert-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 999999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
        .custom-alert-overlay.active { opacity: 1; pointer-events: auto; }
        .custom-alert-box { background: var(--bg-card); border: 2px solid var(--orange-crunchy); border-radius: 8px; width: 88%; max-width: 380px; padding: 25px; box-sizing: border-box; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.8); transform: scale(0.85); transition: transform 0.2s ease; }
        .custom-alert-overlay.active .custom-alert-box { transform: scale(1); }
        .custom-alert-title { color: var(--orange-crunchy); font-size: 19px; font-weight: bold; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .custom-alert-msg { color: var(--text-main); font-size: 14px; line-height: 1.5; margin-bottom: 22px; }
        .custom-alert-btn { background: var(--orange-crunchy); color: #fff; border: none; padding: 11px 30px; font-weight: bold; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 13px; }
    </style>
</head>
<body>

<div id="viewGenerador" class="panel-container">
    <div class="card">
        <h1>Chibimaris: <span>Doramas Onl</span></h1>
        <p style="color: var(--text-muted); margin-top:-10px; font-size:14px;">Conversor Avanzado con Inyección de Filtro DNS-AdGuard para Reproductores.</p>
        <textarea id="rawInput" placeholder="Pega aquí los episodios con estructura '=== EPISODIO 1 ===' ..."></textarea>
        <button onclick="procesarMasivo()">Generar Enlaces Seguros Integrados</button>
        
        <div id="resultArea" class="result-box">
            <span class="output-title">📱 Enlaces procesados para el Reproductor Dinámico:</span>
            <div id="linkOutput" class="output-link"></div>
            <button class="btn-copy" onclick="copiarAlPortapapeles()">📋 Copiar
