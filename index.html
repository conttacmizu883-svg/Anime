<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chibimaris: Anime Onl</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
    <style>
        :root {
            --orange-crunchy: #f47521;
            --orange-hover: #ff8a3d;
            --bg-dark: #141519;
            --bg-card: #23252b;
            --text-main: #f8fafc;
            --text-muted: #a1a1aa;
            
            /* Interfaz Plyr estilo Crunchyroll */
            --plyr-color-main: #f47521;
            --plyr-video-background: #000000;
            --plyr-menu-background: #23252b;
            --plyr-menu-color: #ffffff;
        }
        html, body { background-color: var(--bg-dark); color: var(--text-main); font-family: sans-serif; margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; }
        
        /* MODO PANEL GENERADOR */
        .panel-container { display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .card { width: 100%; max-width: 700px; background-color: var(--bg-card); padding: 30px; border-radius: 4px; border: 1px solid #2d2e33; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { color: var(--orange-crunchy); margin-top: 0; text-transform: uppercase; font-size: 24px; letter-spacing: 1px; }
        h1 span { color: #fff; }
        textarea { width: 100%; height: 150px; background-color: var(--bg-dark); color: #fff; border: 1px solid #3a3b40; border-radius: 4px; padding: 12px; box-sizing: border-box; font-family: monospace; font-size: 13px; }
        button { width: 100%; background-color: var(--orange-crunchy); color: #fff; border: none; padding: 14px; font-size: 16px; font-weight: bold; text-transform: uppercase; border-radius: 4px; cursor: pointer; margin-top: 15px; transition: 0.2s; }
        button:hover { background-color: var(--orange-hover); }
        .result-box { margin-top: 25px; background: var(--bg-dark); padding: 20px; border-left: 4px solid var(--orange-crunchy); display: none; }
        .output-title { font-size: 14px; color: #fff; font-weight: bold; display: block; margin-top: 15px; }
        .output-link { background: #1e2026; padding: 12px; border: 1px solid #333; color: var(--orange-crunchy); font-size: 13px; word-break: break-all; margin-top: 5px; border-radius: 4px; font-family: monospace; user-select: all; }
        
        /* MODO REPRODUCTOR (SOLO EL REPRODUCTOR A PANTALLA COMPLETA) */
        .player-mode { width: 100vw; height: 100vh; display: none; background: #000; position: relative; }
        .video-wrapper { width: 100%; height: 100%; position: relative; background: #000; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        
        /* ANIMACIÓN DE CARGA (SPINNER) */
        .loading-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(20, 21, 25, 0.7); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 5; pointer-events: none; transition: opacity 0.3s; opacity: 0; }
        .spinner { width: 55px; height: 55px; border: 5px solid rgba(244, 117, 33, 0.15); border-top-color: var(--orange-crunchy); border-radius: 50%; animation: girar 0.9s linear infinite; }
        .loading-text { color: #fff; margin-top: 15px; font-size: 15px; font-weight: bold; letter-spacing: 0.5px; }
        
        @keyframes girar { to { transform: rotate(360deg); } }
        .is-loading .loading-overlay { opacity: 1; }
        
        /* Personalización de Subtítulos */
        .plyr__captions .plyr__caption { background: rgba(0, 0, 0, 0.8) !important; color: #ffffff !important; font-size: 18px !important; font-weight: 600; padding: 6px 14px !important; border-radius: 4px; }
    </style>
</head>
<body>

<div id="viewGenerador" class="panel-container">
    <div class="card">
        <h1>Chibimaris: <span>Anime Onl</span></h1>
        <p style="color: var(--text-muted); margin-top:-10px; font-size:14px;">Generador de enlaces cortos optimizados.</p>
        <textarea id="rawInput" placeholder="Pega el bloque completo de la película o episodio aquí..."></textarea>
        <button onclick="procesarCorto()">Generar Enlace Corto</button>
        
        <div id="resultArea" class="result-box">
            <span class="output-title">📱 Enlace Corto para tu App Chibimaris:</span>
            <div id="linkOutput" class="output-link"></div>
        </div>
    </div>
</div>

<div id="viewReproductor" class="player-mode">
    <div id="videoContainer" class="video-wrapper">
        <div class="loading-overlay">
            <div class="spinner"></div>
            <div class="loading-text">Cargando Video...</div>
        </div>
        <video id="player" crossorigin playsinline webkit-playsinline></video>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.12/dist/hls.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>

<script>
    function procesarCorto() {
        const texto = document.getElementById('rawInput').value.trim();
        if(!texto) return alert("Pega el texto primero.");

        const regexVideo = /\[720P\]\s*(https?:\/\/[^\s"']+\.m3u8[^\s"']*)/i;
        const matchV = regexVideo.exec(texto);
        
        const regexSubs = /\[Español\]\s*(https?:\/\/[^\s"']+\.srt[^\s"']*)/i;
        const matchS = regexSubs.exec(texto);

        if(!matchV) return alert("No se encontró ningún video en calidad [720P].");

        let videoUrl = matchV[1].replace(/&amp;/g, '&').replace(/\\u0026/g, '&');
        let subsUrl = matchS ? matchS[1] : '';

        const urlBase = window.location.href.split('?')[0];
        const urlFinal = `${urlBase}?video=${encodeURIComponent(videoUrl)}&subs=${encodeURIComponent(subsUrl)}`;

        document.getElementById('linkOutput').innerText = urlFinal;
        document.getElementById('resultArea').style.display = 'block';
    }

    window.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const videoParam = urlParams.get('video');
        const subsParam = urlParams.get('subs');

        if (videoParam) {
            document.getElementById('viewGenerador').style.display = 'none';
            document.getElementById('viewReproductor').style.display = 'block';
            
            const videoElement = document.getElementById('player');
            const container = document.getElementById('videoContainer');
            const streamUrl = decodeURIComponent(videoParam);
            
            container.classList.add('is-loading');
            videoElement.addEventListener('waiting', () => container.classList.add('is-loading'));
            videoElement.addEventListener('playing', () => container.classList.remove('is-loading'));
            videoElement.addEventListener('canplay', () => container.classList.remove('is-loading'));

            if(subsParam) {
                let track = document.createElement('track');
                track.kind = 'captions';
                track.label = 'Español';
                track.srclang = 'es';
                track.default = true; // Activa por defecto los subtítulos en el navegador
                track.src = await corregirSrtAVtt(decodeURIComponent(subsParam));
                videoElement.appendChild(track);
            }

            // Inicializar Plyr con FORZADO de subtítulos activos
            let player = new Plyr('#player', {
                captions: { active: true, update: true, language: 'es' },
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'fullscreen'],
                settings: ['captions', 'quality']
            });

            if (Hls.isSupported()) {
                let hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 600
                });
                hls.loadSource(streamUrl);
                hls.attachMedia(videoElement);
                
                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    const calidadesDisponibles = data.levels.map(l => l.height).filter(h => h > 0);
                    calidadesDisponibles.sort((a, b) => b - a);
                    
                    // Buscar si existe 720p, si no, agarrar la calidad HD más cercana disponible
                    let calidadObjetivo = calidadesDisponibles.includes(720) ? 720 : calidadesDisponibles[0];
                    
                    // Añadir la opción 'Auto' al menú de la tuerca por si quieren cambiarla después
                    calidadesDisponibles.unshift(0); 
                    
                    player.config.quality = {
                        default: calidadObjetivo, // Forzar la carga inicial en 720p o HD alta
                        options: calidadesDisponibles,
                        forced: true,
                        onChange: (q) => {
                            if (q === 0) {
                                hls.currentLevel = -1;
                            } else {
                                hls.levels.forEach((level, index) => {
                                    if (level.height === q) hls.currentLevel = index;
                                });
                            }
                        }
                    };

                    // Aplicar el cambio de resolución forzado inmediatamente al flujo HLS
                    if (calidadObjetivo !== 0) {
                        hls.levels.forEach((level, index) => {
                            if (level.height === calidadObjetivo) hls.currentLevel = index;
                        });
                    }
                    
                    // Forzar encendido manual de subtítulos tras conectar el flujo
                    setTimeout(() => { player.toggleCaptions(true); }, 600);
                });
            } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                videoElement.src = streamUrl;
            }
        }
    });

    async function corregirSrtAVtt(url) {
        try {
            const r = await fetch(url);
            let t = await r.text();
            let vtt = "WEBVTT\n\n" + t.replace(/,/g, '.').replace(/(\d\d:\d\d:\d\d\.\d\d\d) --> (\d\d:\d\d:\d\d\.\d\d\d)/g, '$1 --> $2');
            return URL.createObjectURL(new Blob([vtt], { type: 'text/vtt' }));
        } catch(e) { return url; }
    }
</script>
</body>
</html>
